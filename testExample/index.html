<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cards</title>
</head>

<body class="body">
    <main>
        <div class="card-container">
            <h1 class="card-container_title">НОМЕРА И ЦЕНЫ</h1>
            <div class="cards">
                <div class="card">
                    <div class="card_image"><img src="images/executive-suite.png"></div>
                    <div class="card_text">
                        <h3 class="card_text_title"><b>Представительский люкс</b></h3>
                        <p class="card_text_description">Эксклюзивный номер с панорамным видом на центр города Москвы</p>
                        <hr class="card_line">
                        <p class="card_price">от <span class="card_price_money">7900 </span>руб./сутки</p>
                        <button class="card_button">Забронировать</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card_image"><img src="images/duplex.png"></div>
                    <div class="card_text">
                        <h3 class="card_text_title"><b>Дуплекс</b></h3>
                        <p class="card_text_description">Просторный двухкомнатный номер с шикарным видом на парк</p>
                        <hr class="card_line">
                        <p class="card_price">от <span class="card_price_money">5700 </span>руб./сутки</p>
                        <button class="card_button">Забронировать</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card_image"><img src="images/business-suite.png"></div>
                    <div class="card_text">
                        <h3 class="card_text_title"><b>Бизнес-люкс</b></h3>
                        <p class="card_text_description">Трехкомнатный номер с панорамным видом на Москва-реку</p>
                        <hr class="card_line">
                        <p class="card_price">от <span class="card_price_money">4900 </span>руб./сутки</p>
                        <button class="card_button">Забронировать</button>
                    </div>
                </div>
            </div>
    </main>
</body>

</html>
